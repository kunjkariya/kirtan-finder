name: kirtan_finder
description: "A fast, cross-platform Kirtan Finder application for iOS, iPadOS, and Android."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  path_provider: ^2.1.5
  path: ^1.9.0
  url_launcher: ^6.3.3
  sqlite3_flutter_libs: ^0.6.0+eol
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/db/kirtan_finder.db
    - assets/images/logo.png
