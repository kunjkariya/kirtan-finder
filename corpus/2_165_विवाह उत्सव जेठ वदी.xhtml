<h1>विवाह उत्सव जेठ वदी</h1>

<div class="kirtan-header">
<p class="raag-title">राग : सारंग</p>
<p class="search-id">कीर्तन क्रमांक : १.५६६</p>
</div>
<div class="kirtan-body">
<p class="kirtan-line title-line"><a href="https://www.youtube.com/results?search_query=%E0%A4%B2%E0%A4%BE%E0%A4%B2+%E0%A4%86%E0%A4%9C+%E0%A4%AC%E0%A4%A8%E0%A4%BE+%E0%A4%AC%E0%A4%A8%E0%A5%8D%E0%A4%AF%E0%A5%8B+%E0%A4%85%E0%A4%A4%E0%A4%BF+%E0%A4%AD%E0%A4%BE%E0%A4%88%2C" style="color: inherit; text-decoration: none;" target="_blank">लाल आज बना बन्यो अति भाई,</a></p>
<p class="kirtan-line verse-end">वागो विचित्र बनाई, जरकसी पाघ चोलना सुंदर अरगजा सोधो लगाई<span class="verse-marker">॥१॥</span></p>
<p class="kirtan-line">तापर फुलनके हार भुषण बहु,</p>
<p class="kirtan-line verse-end">सेहरो सीस सुहाई, वल्लभदास प्रभु व्याहन चलो-सो अब सोभा कहीय न जाय<span class="verse-marker">॥२॥</span></p>
