<h1>हिंडोरा कुसुंबी घटा के पद</h1>
<div class="kirtan-block" data-chapter="118" data-old-page="472" data-raag="मल्हार" id="118-1-472">
<div class="kirtan-header">
<p class="raag-title">राग : मल्हार</p>
<p class="search-id">कीर्तन क्रमांक : १.४७२</p>
</div>
<div class="kirtan-body">
<p class="kirtan-line title-line"><a href="https://www.youtube.com/results?search_query=%E0%A4%B0%E0%A4%82%E0%A4%97+%E0%A4%AD%E0%A4%B0%E0%A5%87+%E0%A4%A6%E0%A5%8B%E0%A4%8A+%E0%A4%85%E0%A4%82%E0%A4%97+%E0%A4%AE%E0%A4%BF%E0%A4%B2%E0%A4%BE%E0%A4%B5%E0%A4%A4+%E0%A4%AC%E0%A5%88%E0%A4%A0%E0%A5%87%E0%A4%82+%E0%A4%B8%E0%A5%81%E0%A4%B0%E0%A4%82%E0%A4%97+%E0%A4%B9%E0%A4%BF%E0%A4%82%E0%A4%A1%E0%A5%8B%E0%A4%B0%E0%A5%87+%E0%A4%86%E0%A4%AF%E0%A5%87+%E0%A5%A5" style="color: inherit; text-decoration: none;" target="_blank">रंग भरे दोऊ अंग मिलावत बैठें सुरंग हिंडोरे आये ॥</a></p>
<p class="kirtan-line verse-end">तेसीय कसूंभी सारी तेसीय पाग भारी तेसोई सुरंग पिछोरा हँसत उठत बिच गाई<span class="verse-marker">॥१॥</span></p>
<p class="kirtan-line">जब हेरत ओरन की दिस तें डरपन की मिस तांन चुकाई ॥</p>
<p class="kirtan-line verse-end">'रसिक' प्रीतम पिय प्यारी की छबि ऐसी मिलि हे सहेज सुभाई<span class="verse-marker">॥२॥</span></p>
</div>
