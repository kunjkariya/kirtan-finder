<h1>चुनरी के पद (हिंडोरा)</h1>
<div class="kirtan-block" data-chapter="125" data-old-page="477" data-raag="सोरठ" id="125-1-477">
<div class="kirtan-header">
<p class="raag-title">राग : सोरठ</p>
<p class="search-id">कीर्तन क्रमांक : १.४७७</p>
</div>
<div class="kirtan-body">
<p class="kirtan-line title-line"><a href="https://www.youtube.com/results?search_query=%E0%A4%9D%E0%A5%81%E0%A4%B2%E0%A4%A4+%E0%A4%B2%E0%A4%B2%E0%A4%A8%E0%A4%BE%E0%A4%82+%E0%A4%B2%E0%A4%BE%E0%A4%B2+%E0%A4%B9%E0%A4%BF%E0%A4%82%E0%A4%A1%E0%A5%8B%E0%A4%B0%E0%A5%87%E0%A4%82+%E0%A5%A5" style="color: inherit; text-decoration: none;" target="_blank">झुलत ललनां लाल हिंडोरें ॥</a></p>
<p class="kirtan-line verse-end">बरन बरन चूनरी तन पहिरें ठाढी नवल वाम हरित भूमि पर चंद्र वधू चहुँ ओरें<span class="verse-marker">॥१॥</span></p>
<p class="kirtan-line">कबहुं न्हेंनी न्हेंनी फूंही डारत फरकत पीत पिछोरें ॥</p>
<p class="kirtan-line verse-end">'रसिक' प्रीतम की बानिक ऊपर डारत हैं तृन तोरें<span class="verse-marker">॥२॥</span></p>
</div>
