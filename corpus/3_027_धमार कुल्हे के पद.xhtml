<h1 class="chapter-title">धमार कुल्हे के पद</h1>

<div class="kirtan-block" data-chapter="27" data-old-page="129" data-raag="काफी" id="27-1-129">
<div class="kirtan-header">
<p class="raag-title">राग : काफी</p>
<p class="search-id">कीर्तन क्रमांक : १.१२९</p>
</div>
<div class="kirtan-body">
<p class="kirtan-line title-line"><a href="https://www.youtube.com/results?search_query=%E0%A4%B9%E0%A5%8B%E0%A4%B0%E0%A5%80+%E0%A4%96%E0%A5%87%E0%A4%B2%E0%A5%88+%E0%A4%AE%E0%A5%8B%E0%A4%B9%E0%A4%A8%E0%A4%BE+%E0%A4%B8%E0%A5%81%E0%A4%82%E0%A4%A6%E0%A4%B0+%E0%A4%97%E0%A4%BF%E0%A4%B0%E0%A4%A7%E0%A4%BE%E0%A4%B0%E0%A5%80+%E0%A5%A5" style="color: inherit; text-decoration: none;" target="_blank">होरी खेलै मोहना सुंदर गिरधारी ॥</a></p>
<p class="kirtan-line verse-end">नख सिख सुभग सिंगार सजै सौंधे सुखकारी<span class="verse-marker">॥१॥</span></p>
<p class="kirtan-line">सीस कुल्हे छबि अति बनी सोहै ललित लला री ॥</p>
<p class="kirtan-line verse-end">केसर को बागो बन्यौं सोहै अति भारी<span class="verse-marker">॥२॥</span></p>
<p class="kirtan-line">लाल गुलाल उड़ाव हीं रँग रह्यो सरसा री ॥</p>
<p class="kirtan-line verse-end">यह सुख सोभा निरखि के 'सूरदास' बलिहारी<span class="verse-marker">॥३॥</span></p>
</div>
