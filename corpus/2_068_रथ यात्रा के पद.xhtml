<h1>रथ यात्रा के पद (आषाढ़ सुदि २)</h1>
<div class="kirtan-block" data-chapter="68" data-old-page="368" data-raag="सारंग" id="68-1-368">
<div class="kirtan-header">
<p class="raag-title">राग : सारंग</p>
<p class="search-id">कीर्तन क्रमांक : १.३६८</p>
</div>
<div class="kirtan-body">
<p class="kirtan-line title-line"><a href="https://www.youtube.com/results?search_query=%E0%A4%AF%E0%A4%B9+%E0%A4%A2%E0%A5%8B%E0%A4%9F%E0%A4%BE+%E0%A4%B9%E0%A4%A0+%E0%A4%B9%E0%A4%B0%E0%A4%A4+%E0%A4%AA%E0%A4%B0%E0%A4%BE%E0%A4%AF%E0%A5%8B+%E0%A4%AE%E0%A4%A8+%E0%A5%A5" style="color: inherit; text-decoration: none;" target="_blank">यह ढोटा हठ हरत परायो मन ॥</a></p>
<p class="kirtan-line verse-end">देखत रूप ठगोरी सी लागत जगत विमोहन स्याम बरन तन<span class="verse-marker">॥१॥</span></p>
<p class="kirtan-line">दिन दिन चोंप चोगनीसी लागत पावस ऋतु मानौं नव तन घन ॥</p>
<p class="kirtan-line verse-end">दामिनि कोटि पीतांबर की छबि 'परमानंद' राजति बिंदाबन<span class="verse-marker">॥२॥</span></p>
