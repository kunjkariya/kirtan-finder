<p class="kirtan-line verse-end">श्रीवल्लभ कै चरन कमलकी बलि बलि जाइए<span class="verse-marker">॥१॥</span></p>
<p class="kirtan-line">वल्लभी सृष्टि समाज संग मिली जीवनकौं फल पाइए ॥</p>
<p class="kirtan-line verse-end">श्रीवल्लभ गुन गाइए याहि तैं 'रसिक' कहाइए<span class="verse-marker">॥२॥</span></p>
