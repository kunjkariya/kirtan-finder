<h1>केसर के हिंडोरा</h1>
<div class="kirtan-block" data-chapter="122" data-old-page="474" data-raag="भीमपलास" id="122-1-474">
<div class="kirtan-header">
<p class="raag-title">राग : भीमपलास</p>
<p class="search-id">कीर्तन क्रमांक : १.४७४</p>
</div>
<div class="kirtan-body">
<p class="kirtan-line title-line"><a href="https://www.youtube.com/results?search_query=%E0%A4%9D%E0%A5%82%E0%A4%B2%E0%A4%A4+%E0%A4%AC%E0%A4%BE%E0%A4%B2%E0%A4%95%E0%A5%83%E0%A4%B7%E0%A5%8D%E0%A4%A3+%E0%A4%B5%E0%A4%BF%E0%A4%B9%E0%A4%BE%E0%A4%B0%E0%A5%80+%E0%A5%A5" style="color: inherit; text-decoration: none;" target="_blank">झूलत बालकृष्ण विहारी ॥</a></p>
<p class="kirtan-line verse-end">व्रजनारी सब देखन आईं पहर केसररंग सारी<span class="verse-marker">॥१॥</span></p>
<p class="kirtan-line">केसरके दोउ खंभ बनाये दांडी चार सँवारी ॥</p>
<p class="kirtan-line verse-end">केसरकी पटुली राजत है मोतिन झुमक सारी<span class="verse-marker">॥२॥</span></p>
<p class="kirtan-line">केसर मुकुट मकराकृत कुंडल छबि लागत अति प्यारी ॥</p>
<p class="kirtan-line verse-end">चत्रभुज प्रभुकी छबि निरखत हि तनमन डारों वारी<span class="verse-marker">॥३॥</span></p>
</div>
</div>
