<div class="kirtan-body">
<p class="kirtan-line title-line"><a href="https://www.youtube.com/results?search_query=%E0%A4%85%E0%A4%B0%E0%A5%80%E0%A4%B9%E0%A5%8B+%E0%A4%AF%E0%A4%BE+%E0%A4%AE%E0%A4%97+%E0%A4%A8%E0%A4%BF%E0%A4%95%E0%A4%B8%E0%A5%80+%E0%A4%86%E0%A4%AF+%E0%A4%85%E0%A4%9A%E0%A4%BE%E0%A4%A8%E0%A4%95+%E0%A4%95%E0%A4%BE%E0%A4%A8%E0%A5%8D%E0%A4%B9%E0%A4%95%E0%A5%81%E0%A4%82%E0%A4%B5%E0%A4%B0+%E0%A4%A0%E0%A4%BE%E0%A4%A2%E0%A5%87+%E0%A4%86%E0%A4%AA%E0%A4%A8%E0%A5%80+%E0%A4%AA%E0%A5%8B%E0%A4%B0+%E0%A5%A5" style="color: inherit; text-decoration: none;" target="_blank">अरीहो या मग निकसी आय अचानक कान्हकुंवर ठाढे आपनी पोर ॥</a></p>
<p class="kirtan-line verse-end">दृष्टिसों दृष्टिमिली रोमरोम सीतल भई तनमें उठीहै कींधो कामरोर<span class="verse-marker">॥१॥</span></p>
<p class="kirtan-line">लालपाग झुक रही भ्रोहनपर स्याम गातकिये चंदनकी खोर ॥</p>
<p class="kirtan-line verse-end">सूरदासप्रभु सर्वस्व हरके चलें मनमें आवत कैंधो मिलोरी दौरी<span class="verse-marker">॥१॥</span></p>
